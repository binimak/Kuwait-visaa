<!DOCTYPE html>
<html lang="am">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Personal Information</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
    padding:20px;
}

.container{
    max-width:850px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#075985,#0ea5e9);
    color:white;
    padding:25px;
    text-align:center;
    border-radius:20px 20px 0 0;
}

.card{
    background:white;
    padding:25px;
    border-radius:0 0 20px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.profile{
    text-align:center;
    padding-bottom:25px;
    border-bottom:1px solid #e2e8f0;
}

.profile img{
    width:145px;
    height:145px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid #e0f2fe;
}

.name{
    margin-top:12px;
    font-size:24px;
    font-weight:bold;
}

.code{
    color:#64748b;
    margin-top:6px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:25px;
}

.item{
    padding:15px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:12px;
}

.label{
    color:#64748b;
    font-size:13px;
    margin-bottom:6px;
}

.value{
    font-weight:bold;
    word-break:break-word;
}

.document{
    margin-top:30px;
    text-align:center;
}

.document h2{
    margin-bottom:15px;
}

.document img{
    max-width:100%;
    max-height:600px;
    border-radius:12px;
    border:1px solid #cbd5e1;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

button{
    flex:1;
    height:48px;
    border:0;
    border-radius:10px;
    background:#075985;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.logout{
    background:#dc2626;
}

.error{
    text-align:center;
    padding:50px 20px;
}

.error h2{
    margin-bottom:10px;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#075985;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

@media(max-width:600px){

    .info{
        grid-template-columns:1fr;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>

</head>


<body>

<div class="container">

<div class="header">
    <h1>Personal Information</h1>
    <p>የተመዘገበ መረጃ</p>
</div>


<div class="card" id="content">

</div>

</div>


<script>


/* ==========================
   GET CODE
========================== */

const code =
    localStorage.getItem("vcode");


const content =
    document.getElementById("content");


/* ==========================
   NO CODE
========================== */

if(!code){

    content.innerHTML=`

        <div class="error">

            <h2>❌ Access Denied</h2>

            <p>
                Code አልተገኘም።
            </p>

            <a
                class="back"
                href="index.html"
            >
                Back
            </a>

        </div>

    `;

}


/* ==========================
   GET USER
========================== */

else{

    const saved =
        localStorage.getItem("user_"+code);


    if(!saved){

        content.innerHTML=`

            <div class="error">

                <h2>❌ User Not Found</h2>

                <p>
                    የተመዘገበ መረጃ አልተገኘም።
                </p>

                <a
                    class="back"
                    href="index.html"
                >
                    Back
                </a>

            </div>

        `;

    }

    else{

        const user =
            JSON.parse(saved);


        content.innerHTML=`

            <div class="profile">

                ${
                    user.photo
                    ?
                    `<img src="${user.photo}" alt="Profile Photo">`
                    :
                    `<div style="
                        width:145px;
                        height:145px;
                        margin:auto;
                        border-radius:50%;
                        background:#e2e8f0;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;
                    ">👤</div>`
                }

                <div class="name">
                    ${user.name}
                </div>

                <div class="code">
                    Code: ${code}
                </div>

            </div>


            <div class="info">

                <div class="item">
                    <div class="label">Gender</div>
                    <div class="value">${user.gender || "-"}</div>
                </div>

                <div class="item">
                    <div class="label">Age</div>
                    <div class="value">${user.age || "-"}</div>
                </div>

                <div class="item">
                    <div class="label">Date of Birth</div>
                    <div class="value">${user.dob || "-"}</div>
                </div>

                <div class="item">
                    <div class="label">ELMIS</div>
                    <div class="value">${user.elmis || "-"}</div>
                </div>

                <div class="item">
                    <div class="label">Passport</div>
                    <div class="value">${user.passport || "-"}</div>
                </div>

                <div class="item">
                    <div class="label">Phone</div>
                    <div class="value">${user.phone || "-"}</div>
                </div>

                <div class="item">
                    <div class="label">Birth Country</div>
                    <div class="value">${user.birth || "-"}</div>
                </div>

                <div class="item">
                    <div class="label">Visa Type</div>
                    <div class="value">${user.visa || "-"}</div>
                </div>

                <div class="item">
                    <div class="label">Destination</div>
                    <div class="value">${user.country || "-"}</div>
                </div>

            </div>


            ${
                user.doc
                ?
                `
                <div class="document">

                    <h2>Document</h2>

                    <img
                        src="${user.doc}"
                        alt="Document"
                    >

                </div>
                `
                :
                ""
            }


            <div class="buttons">

                <button onclick="window.print()">
                    🖨️ Print
                </button>

                <button
                    class="logout"
                    onclick="logout()"
                >
                    Exit
                </button>

            </div>

        `;

    }

}


/* ==========================
   LOGOUT
========================== */

function logout(){

    localStorage.removeItem("vcode");

    window.location.href="index.html";

}

</script>

</body>
</html>
