<!DOCTYPE html>
<html lang="am">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Code Verification System"
>

<title>Code Verification</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            135deg,
            #075985,
            #0ea5e9
        );

    padding:20px;
}

.box{
    width:100%;
    max-width:430px;

    background:#fff;

    padding:60px 25px 45px;

    border-radius:22px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.20);

    text-align:center;
}

.icon{
    width:140px;
    height:140px;

    margin:0 auto 25px;

    border-radius:50%;

    background:#e0f2fe;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:65px;
}

h1{
    color:#075985;

    margin-bottom:10px;

    font-size:42px;
}

p{
    color:#64748b;

    margin-bottom:28px;

    line-height:1.6;

    font-size:18px;
}

input{
    width:100%;

    height:58px;

    border:
        1px solid
        #cbd5e1;

    border-radius:14px;

    padding:0 15px;

    font-size:21px;

    text-align:center;

    outline:none;

    transition:.2s;
}

input:focus{
    border-color:#0ea5e9;

    box-shadow:
        0 0 0 3px
        rgba(14,165,233,.12);
}

button{
    width:100%;

    height:58px;

    margin-top:16px;

    border:0;

    border-radius:14px;

    background:#075985;

    color:white;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    background:#0369a1;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#msg{
    min-height:30px;

    margin-top:18px;

    font-weight:bold;

    font-size:18px;
}

.register{
    display:block;

    margin-top:25px;

    color:#075985;

    text-decoration:none;

    font-weight:bold;

    font-size:18px;
}

.register:hover{
    text-decoration:underline;
}

@media(max-width:500px){

    .box{
        padding:55px 22px 40px;
    }

    h1{
        font-size:36px;
    }

    .icon{
        width:130px;
        height:130px;
        font-size:60px;
    }

}

</style>

</head>

<body>


<div class="box">


    <div class="icon">
        🔐
    </div>


    <h1>
        Enter Your Code
    </h1>


    <p>
        የግል መረጃዎን ለማየት Code ያስገቡ
    </p>


    <input
        id="code"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="6"
        placeholder="Enter Code"
    >


    <button
        id="continueBtn"
        type="button"
        onclick="checkCode()"
    >
        Continue
    </button>


    <div id="msg"></div>


    <a
        class="register"
        href="register.html"
    >
        ➕ New Registration
    </a>


</div>



<script>

/* =====================================================
   CHECK CODE
===================================================== */

function checkCode(){

    const input =
        document.getElementById("code");

    const msg =
        document.getElementById("msg");

    const button =
        document.getElementById("continueBtn");


    const code =
        input.value.trim();


    /* ==========================
       EMPTY
    ========================== */

    if(!code){

        msg.style.color =
            "#dc2626";

        msg.textContent =
            "❌ Please enter your code.";

        input.focus();

        return;
    }


    /* ==========================
       ONLY NUMBERS
    ========================== */

    if(!/^[0-9]+$/.test(code)){

        msg.style.color =
            "#dc2626";

        msg.textContent =
            "❌ Code must contain numbers only.";

        input.focus();

        return;
    }


    /* ==========================
       CODE LENGTH
    ========================== */

    if(code.length !== 6){

        msg.style.color =
            "#dc2626";

        msg.textContent =
            "❌ Code must be 6 digits.";

        input.focus();

        return;
    }


    /* =================================================
       IMPORTANT
       
       እዚህ localStorage ውስጥ
       user_692122 መኖሩን አንፈትሽም።

       የገባውን Code ብቻ
       እንይዛለን።
    ================================================= */


    localStorage.setItem(
        "vcode",
        code
    );


    /* Remove old current user */

    localStorage.removeItem(
        "currentUser"
    );


    /* ==========================
       SUCCESS
    ========================== */

    msg.style.color =
        "#16a34a";

    msg.textContent =
        "✅ Code Accepted";


    button.disabled =
        true;

    button.textContent =
        "Opening Registration...";


    /* ==========================
       OPEN REGISTER FORM
    ========================== */

    setTimeout(function(){

        window.location.href =
            "register.html";

    },500);

}


/* =====================================================
   ENTER KEY
===================================================== */

document
.getElementById("code")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            checkCode();

        }

    }
);


/* =====================================================
   CLEAR MESSAGE
===================================================== */

document
.getElementById("code")
.addEventListener(
    "input",
    function(){

        document
        .getElementById("msg")
        .textContent = "";

    }
);

</script>


</body>

</html>
