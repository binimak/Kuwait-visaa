<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Verification</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#075985,#0ea5e9);
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:32px 25px;
    border-radius:22px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    text-align:center;
}

.icon{
    width:75px;
    height:75px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#e0f2fe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
}

h1{
    color:#075985;
    margin-bottom:8px;
}

p{
    color:#64748b;
    margin-bottom:25px;
}

input{
    width:100%;
    height:52px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    padding:0 15px;
    font-size:18px;
    text-align:center;
    outline:none;
}

input:focus{
    border-color:#0ea5e9;
}

button{
    width:100%;
    height:52px;
    margin-top:14px;
    border:0;
    border-radius:12px;
    background:#075985;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0369a1;
}

#msg{
    min-height:25px;
    margin-top:16px;
    font-weight:bold;
}

.register{
    display:block;
    margin-top:22px;
    color:#075985;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

    <div class="icon">🔐</div>

    <h1>Enter Your Code</h1>

    <p>የግል መረጃዎን ለማየት Code ያስገቡ</p>

    <input
        id="code"
        type="text"
        placeholder="Enter Code"
        inputmode="numeric"
        autocomplete="off"
    >

    <button onclick="checkCode()">
        Continue
    </button>

    <div id="msg"></div>

    <a class="register" href="register.html">
        ➕ New Registration
    </a>

</div>

<script>

function checkCode(){

    const code =
        document.getElementById("code").value.trim();

    const msg =
        document.getElementById("msg");

    if(!code){

        msg.style.color="red";
        msg.textContent="❌ Please enter your code.";
        return;

    }

    const data =
        localStorage.getItem("user_"+code);

    if(data){

        localStorage.setItem("vcode",code);

        msg.style.color="green";
        msg.textContent="✅ Access Granted";

        setTimeout(()=>{
            window.location.href="personal.html";
        },600);

    }else{

        msg.style.color="red";
        msg.textContent="❌ Invalid Code";

    }
}


document
.getElementById("code")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        checkCode();
    }

});

</script>

</body>
</html>
