<!DOCTYPE html>
<html lang="am">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Code Verification System"
>

<title>Code Verification</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            135deg,
            #075985,
            #0ea5e9
        );

    padding:20px;
}

.box{
    width:100%;
    max-width:430px;

    background:#fff;

    padding:55px 25px 40px;

    border-radius:24px;

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.22);

    text-align:center;
}

.icon{
    width:135px;
    height:135px;

    margin:0 auto 24px;

    border-radius:50%;

    background:#e0f2fe;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:62px;
}

h1{
    color:#075985;

    margin-bottom:10px;

    font-size:40px;

    font-weight:700;
}

p{
    color:#64748b;

    margin-bottom:28px;

    line-height:1.6;

    font-size:18px;
}

input{
    width:100%;

    height:58px;

    border:1px solid #cbd5e1;

    border-radius:14px;

    padding:0 15px;

    font-size:21px;

    text-align:center;

    outline:none;

    transition:.2s;
}

input:focus{
    border-color:#0ea5e9;

    box-shadow:
        0 0 0 4px
        rgba(14,165,233,.12);
}

button{
    width:100%;

    height:58px;

    margin-top:16px;

    border:0;

    border-radius:14px;

    background:#075985;

    color:white;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    background:#0369a1;
}

button:disabled{
    opacity:.65;

    cursor:not-allowed;
}

#msg{
    min-height:28px;

    margin-top:18px;

    font-weight:bold;

    font-size:18px;
}

.register{
    display:block;

    margin-top:25px;

    color:#075985;

    text-decoration:none;

    font-weight:bold;

    font-size:18px;
}

.register:hover{
    text-decoration:underline;
}

@media(max-width:500px){

    .box{
        padding:
            50px
            20px
            38px;
    }

    h1{
        font-size:35px;
    }

    .icon{
        width:125px;
        height:125px;
        font-size:58px;
    }

}

</style>

</head>


<body>


<div class="box">


    <div class="icon">
        🔐
    </div>


    <h1>
        Enter Your Code
    </h1>


    <p>
        ELMIS መረጃዎን ለማየት Code ያስገቡ
    </p>


    <input
        id="code"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="6"
        placeholder="Enter Code"
    >


    <button
        id="continueBtn"
        type="button"
        onclick="checkCode()"
    >
        Continue
    </button>


    <div id="msg"></div>


    <a
        class="register"
        href="register.html"
    >
        ➕ New Registration
    </a>


</div>


<script>

/* =====================================================
   APPROVED CODES
===================================================== */

const VALID_CODES = [

    "692122",
    "123456",
    "456789",
    "987456",
    "789654",
    "111111"
"222222"
  "123123"  
];


/*
=========================================================
   እዚህ በፈለግኸው መጠን Code መጨመር ትችላለህ።

   ምሳሌ:

   "222222",
   "333333",
   "444444",

=========================================================
*/


/* =====================================================
   CHECK CODE
===================================================== */

function checkCode(){

    const input =
        document.getElementById("code");

    const msg =
        document.getElementById("msg");

    const button =
        document.getElementById("continueBtn");


    const code =
        input.value.trim();


    /* ================================================
       EMPTY
    ================================================= */

    if(code === ""){

        msg.style.color =
            "#dc2626";

        msg.textContent =
            "❌ Please enter your code.";

        input.focus();

        return;
    }


    /* ================================================
       NUMBERS ONLY
    ================================================= */

    if(!/^[0-9]+$/.test(code)){

        msg.style.color =
            "#dc2626";

        msg.textContent =
            "❌ Code must contain numbers only.";

        input.focus();

        return;
    }


    /* ================================================
       SIX DIGITS
    ================================================= */

    if(code.length !== 6){

        msg.style.color =
            "#dc2626";

        msg.textContent =
            "❌ Code must be 6 digits.";

        input.focus();

        return;
    }


    /* ================================================
       CHECK MULTIPLE CODES
    ================================================= */

    const isValid =
        VALID_CODES.includes(code);


    /* ================================================
       INVALID CODE
    ================================================= */

    if(!isValid){

        msg.style.color =
            "#dc2626";

        msg.textContent =
            "❌ Invalid Code";

        input.focus();

        return;
    }


    /* ================================================
       VALID CODE
    ================================================= */


    /*
       የገባውን Code እናስቀምጣለን።
    */

    localStorage.setItem(
        "vcode",
        code
    );


    /*
       የቀድሞ currentUser
       እንዳይቀላቀል
       እናጠፋለን።
    */

    localStorage.removeItem(
        "currentUser"
    );


    /* ================================================
       SUCCESS MESSAGE
    ================================================= */

    msg.style.color =
        "#16a34a";

    msg.textContent =
        "✅ Code Accepted";


    button.disabled =
        true;

    button.textContent =
        "Opening Registration...";


    /* ================================================
       OPEN REGISTRATION
    ================================================= */

    setTimeout(function(){

        window.location.href =
            "register.html";

    },500);

}


/* =====================================================
   ENTER KEY
===================================================== */

document
.getElementById("code")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            checkCode();

        }

    }
);


/* =====================================================
   CLEAR MESSAGE WHEN TYPING
===================================================== */

document
.getElementById("code")
.addEventListener(
    "input",
    function(){

        document
        .getElementById("msg")
        .textContent = "";

    }
);


/* =====================================================
   ALLOW NUMBERS ONLY
===================================================== */

document
.getElementById("code")
.addEventListener(
    "input",
    function(){

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );

    }
);

</script>


</body>

</html>
