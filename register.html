<!DOCTYPE html>
<html lang="am">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registration Form</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    padding:20px 12px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(
        135deg,
        #075985,
        #0ea5e9
    );

    color:white;

    padding:25px 20px;

    border-radius:20px 20px 0 0;

    text-align:center;
}

.header h1{
    font-size:28px;
    margin-bottom:7px;
}

.header p{
    line-height:1.6;
}

/* ================= FORM ================= */

.form{
    background:white;

    padding:22px;

    border-radius:0 0 20px 20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);
}

.group{
    margin-bottom:17px;
}

label{
    display:block;

    margin-bottom:7px;

    font-weight:bold;

    color:#334155;
}

input,
select{
    width:100%;

    height:48px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    padding:0 12px;

    font-size:15px;

    outline:none;
}

input:focus,
select:focus{
    border-color:#0ea5e9;

    box-shadow:
        0 0 0 3px
        rgba(14,165,233,.10);
}

.grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;
}

/* ================= CODE ================= */

.codeBox{

    background:#f0f9ff;

    border:1px solid #bae6fd;

    border-radius:12px;

    padding:15px;

    margin-bottom:20px;

    text-align:center;
}

.codeBox small{
    display:block;

    color:#64748b;

    margin-bottom:5px;
}

.codeValue{
    font-size:26px;

    font-weight:bold;

    letter-spacing:3px;

    color:#075985;
}

/* ================= BUTTON ================= */

button{
    width:100%;

    height:52px;

    border:0;

    border-radius:11px;

    background:#075985;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-top:8px;
}

button:hover{
    background:#0369a1;
}

button:disabled{
    opacity:1;

    cursor:not-allowed;
}

/* ================= PREVIEW ================= */

.preview{
    display:none;

    margin-top:10px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid #cbd5e1;
}

#photoPreview{
    width:120px;
    height:120px;
}

#docPreview{
    width:100%;
    max-height:220px;
}

/* ================= ERROR ================= */

.error{

    color:#dc2626;

    background:#fef2f2;

    border:1px solid #fecaca;

    padding:12px;

    border-radius:10px;

    margin-bottom:18px;

    display:none;

    text-align:center;

    font-weight:bold;
}

/* =====================================================
   SUCCESS SCREEN
===================================================== */

#successScreen{

    display:none;

    position:fixed;

    inset:0;

    z-index:9999;

    background:
        linear-gradient(
            135deg,
            #075985,
            #0ea5e9
        );

    align-items:center;

    justify-content:center;

    padding:20px;

    text-align:center;
}

.successCard{

    width:100%;

    max-width:500px;

    background:white;

    border-radius:25px;

    padding:38px 25px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);

    animation:
        successIn .5s ease;
}

@keyframes successIn{

    from{
        opacity:0;
        transform:scale(.85);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* SUCCESS ICON */

.successIcon{

    width:90px;

    height:90px;

    margin:0 auto 20px;

    border-radius:50%;

    background:#dcfce7;

    color:#16a34a;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:52px;

    font-weight:bold;
}

.successCard h2{

    color:#15803d;

    font-size:26px;

    margin-bottom:12px;
}

.successCard p{

    color:#64748b;

    line-height:1.7;

    margin-bottom:20px;
}

.successCode{

    background:#f0f9ff;

    border:2px solid #bae6fd;

    border-radius:15px;

    padding:16px;

    margin-bottom:20px;
}

.successCode small{

    display:block;

    color:#64748b;

    margin-bottom:7px;
}

.successCode strong{

    color:#075985;

    font-size:34px;

    letter-spacing:4px;
}

.profileBtn{

    background:#075985;

    margin-top:0;
}

.homeBtn{

    background:#e2e8f0;

    color:#334155;

    margin-top:10px;
}

/* ================= LOADING ================= */

.loadingBox{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;
}

.spinner{

    width:24px;

    height:24px;

    border:3px solid
        rgba(255,255,255,.35);

    border-top-color:white;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .form{
        padding:18px;
    }

    .header h1{
        font-size:25px;
    }

    .successCard{
        padding:32px 20px;
    }

    .successCard h2{
        font-size:23px;
    }

    .successCode strong{
        font-size:30px;
    }

}

</style>

</head>

<body>


<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>
            Registration Form
        </h1>

        <p>
            የተጠቃሚ መረጃ መመዝገቢያ
        </p>

    </div>


    <!-- FORM -->

    <div class="form">


        <!-- CODE -->

        <div class="codeBox">

            <small>
                Registration Code
            </small>

            <div
                class="codeValue"
                id="registrationCode"
            >
                Loading...
            </div>

        </div>


        <!-- ERROR -->

        <div
            class="error"
            id="errorBox"
        ></div>


        <form id="registrationForm">


            <!-- NAME -->

            <div class="group">

                <label>
                    Full Name
                </label>

                <input
                    id="name"
                    type="text"
                    required
                    placeholder="ሙሉ ስም"
                >

            </div>


            <!-- GENDER / AGE -->

            <div class="grid">

                <div class="group">

                    <label>
                        Gender
                    </label>

                    <select
                        id="gender"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="ወንድ">
                            ወንድ
                        </option>

                        <option value="ሴት">
                            ሴት
                        </option>

                    </select>

                </div>


                <div class="group">

                    <label>
                        Age
                    </label>

                    <input
                        id="age"
                        type="number"
                        min="1"
                        max="120"
                        required
                    >

                </div>

            </div>


            <!-- DOB -->

            <div class="group">

                <label>
                    Date of Birth
                </label>

                <input
                    id="dob"
                    type="date"
                    required
                >

            </div>


            <!-- ELMIS / PASSPORT -->

            <div class="grid">

                <div class="group">

                    <label>
                        ELMIS Number
                    </label>

                    <input
                        id="elmis"
                        placeholder="ELMIS-XXXXXX"
                    >

                </div>


                <div class="group">

                    <label>
                        Passport Number
                    </label>

                    <input
                        id="passport"
                        placeholder="Passport Number"
                    >

                </div>

            </div>


            <!-- PHONE -->

            <div class="group">

                <label>
                    Phone
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="Phone Number"
                >

            </div>


            <!-- BIRTH -->

            <div class="group">

                <label>
                    Birth Country
                </label>

                <input
                    id="birth"
                    value="ኢትዮጵያ"
                >

            </div>


            <!-- VISA / COUNTRY -->

            <div class="grid">

                <div class="group">

                    <label>
                        Visa Type
                    </label>

                    <select id="visa">

                        <option value="">
                            Select Visa
                        </option>

                        <option value="ስራ ቪዛ">
                            ስራ ቪዛ
                        </option>

                        <option value="የቱሪስት ቪዛ">
                            የቱሪስት ቪዛ
                        </option>

                        <option value="የቤተሰብ ቪዛ">
                            የቤተሰብ ቪዛ
                        </option>

                        <option value="የተማሪ ቪዛ">
                            የተማሪ ቪዛ
                        </option>

                    </select>

                </div>


                <div class="group">

                    <label>
                        Destination
                    </label>

                    <input
                        id="country"
                        placeholder="ለምሳሌ ካናዳ 🇨🇦"
                    >

                </div>

            </div>


            <!-- PROFILE PHOTO -->

            <div class="group">

                <label>
                    Profile Photo
                </label>

                <input
                    id="photo"
                    type="file"
                    accept="image/*"
                >

                <img
                    id="photoPreview"
                    class="preview"
                    alt="Profile Preview"
                >

            </div>


            <!-- DOCUMENT -->

            <div class="group">

                <label>
                    Document Photo
                </label>

                <input
                    id="doc"
                    type="file"
                    accept="image/*"
                >

                <img
                    id="docPreview"
                    class="preview"
                    alt="Document Preview"
                >

            </div>


            <!-- REGISTER BUTTON -->

            <button
                id="registerBtn"
                type="submit"
            >
                Register
            </button>


        </form>

    </div>

</div>


<!-- =====================================================
     SUCCESS SCREEN
===================================================== -->

<div id="successScreen">

    <div class="successCard">

        <div class="successIcon">
            ✓
        </div>


        <h2>
            ምዝገባዎ በተሳካ ሁኔታ
            ተሳክቷል!
        </h2>


        <p>
            Registration Successful
            <br>
            መረጃዎ በትክክል ተመዝግቧል።
        </p>


        <div class="successCode">

            <small>
                Your Registration Code
            </small>

            <strong
                id="successCode"
            ></strong>

        </div>


        <button
            class="profileBtn"
            type="button"
            onclick="goToProfile()"
        >
            View Personal Information
        </button>


        <button
            class="homeBtn"
            type="button"
            onclick="goHome()"
        >
            Back to Code Verification
        </button>

    </div>

</div>


<script>

/* =====================================================
   GET REGISTRATION CODE
===================================================== */

const registrationCode =
    localStorage.getItem("vcode");

const codeElement =
    document.getElementById(
        "registrationCode"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


if(!registrationCode){

    codeElement.textContent =
        "NO CODE";

    errorBox.style.display =
        "block";

    errorBox.textContent =
        "❌ Code አልተገኘም። እባክዎ Index ገጽ ላይ Code ያስገቡ።";

    document
    .getElementById(
        "registrationForm"
    )
    .style.display =
        "none";

}else{

    codeElement.textContent =
        registrationCode;

}


/* =====================================================
   IMAGE → BASE64
===================================================== */

function imageToBase64(file){

    return new Promise(
        (resolve,reject)=>{

            if(!file){

                resolve("");

                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function(){

                    resolve(
                        reader.result
                    );

                };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   PHOTO PREVIEW
===================================================== */

document
.getElementById("photo")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        const preview =
            document.getElementById(
                "photoPreview"
            );

        if(!file){

            preview.style.display =
                "none";

            return;
        }

        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";

    }
);


/* =====================================================
   DOCUMENT PREVIEW
===================================================== */

document
.getElementById("doc")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        const preview =
            document.getElementById(
                "docPreview"
            );

        if(!file){

            preview.style.display =
                "none";

            return;
        }

        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";

    }
);


/* =====================================================
   REGISTER
===================================================== */

document
.getElementById("registrationForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        if(!registrationCode){

            return;
        }


        const registerBtn =
            document.getElementById(
                "registerBtn"
            );


        /* ==========================
           LOADING
        ========================== */

        registerBtn.disabled =
            true;

        registerBtn.innerHTML = `

            <div class="loadingBox">

                <span class="spinner"></span>

                <span>
                    Registering...
                </span>

            </div>

        `;


        try{

            /* ==========================
               GET FILES
            ========================== */

            const photoFile =
                document
                .getElementById("photo")
                .files[0];

            const docFile =
                document
                .getElementById("doc")
                .files[0];


            /* ==========================
               CONVERT IMAGES
            ========================== */

            const photo =
                await imageToBase64(
                    photoFile
                );

            const doc =
                await imageToBase64(
                    docFile
                );


            /* ==========================
               USER DATA
            ========================== */

            const user = {

                code:
                    registrationCode,

                name:
                    document
                    .getElementById("name")
                    .value
                    .trim(),

                gender:
                    document
                    .getElementById("gender")
                    .value,

                age:
                    document
                    .getElementById("age")
                    .value,

                dob:
                    document
                    .getElementById("dob")
                    .value,

                elmis:
                    document
                    .getElementById("elmis")
                    .value
                    .trim(),

                passport:
                    document
                    .getElementById("passport")
                    .value
                    .trim(),

                phone:
                    document
                    .getElementById("phone")
                    .value
                    .trim(),

                birth:
                    document
                    .getElementById("birth")
                    .value
                    .trim(),

                visa:
                    document
                    .getElementById("visa")
                    .value,

                country:
                    document
                    .getElementById("country")
                    .value
                    .trim(),

                photo:
                    photo,

                doc:
                    doc,

                createdAt:
                    new Date()
                    .toISOString()

            };


            /* ==========================
               SAVE USER
            ========================== */

            localStorage.setItem(

                "user_" +
                registrationCode,

                JSON.stringify(user)

            );


            /* ==========================
               CURRENT USER
            ========================== */

            localStorage.setItem(

                "currentUser",

                JSON.stringify(user)

            );


            /* ==========================
               KEEP CODE
            ========================== */

            localStorage.setItem(

                "vcode",

                registrationCode

            );


            /*
               Small delay so the user
               sees the loading animation.
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1800
                    )
            );


            /* ==========================
               SHOW SUCCESS SCREEN
            ========================== */

            document
            .getElementById(
                "successCode"
            )
            .textContent =
                registrationCode;


            document
            .getElementById(
                "successScreen"
            )
            .style.display =
                "flex";


        }catch(error){

            console.error(error);


            errorBox.style.display =
                "block";

            errorBox.textContent =
                "❌ Registration failed. Please try again.";


            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Register";

        }

    }
);


/* =====================================================
   VIEW PERSONAL INFORMATION
===================================================== */

function goToProfile(){

    window.location.href =
        "personal.html";

}


/* =====================================================
   BACK HOME
===================================================== */

function goHome(){

    window.location.href =
        "index.html";

}

</script>

</body>

</html>
